<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer compass glow ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="12 12" opacity="0.4" />
  <circle cx="256" cy="256" r="160" fill="#0f172a" stroke="#1e293b" stroke-width="4" />

  <!-- Stylized Taegeuk Yin-Yang (South Korea motif) -->
  <!-- Top Red half -->
  <path d="M 256,126 A 130,130 0 0,1 256,386 A 65,65 0 0,1 256,256 A 65,65 0 0,0 256,126 Z" fill="url(#redGrad)" />
  <!-- Bottom Blue half -->
  <path d="M 256,126 A 65,65 0 0,1 256,256 A 65,65 0 0,0 256,386 A 130,130 0 0,1 256,126 Z" fill="url(#blueGrad)" />

  <!-- Navigation Compass Pin Overlay in center -->
  <circle cx="256" cy="256" r="32" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))" />
  <polygon points="256,200 268,256 256,246 244,256" fill="#ef4444" />
  <polygon points="256,312 268,256 256,266 244,256" fill="#3b82f6" />
  <circle cx="256" cy="256" r="6" fill="#0f172a" />
</svg>
